name: Feature request
description: Propose a scoped systemgmmkit improvement.
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Explain the workflow, estimator, diagnostic, report, or API improvement.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation and documentation route
      description: List tests, parity evidence, examples, and docs needed for the change.
