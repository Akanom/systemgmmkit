name: Publish Python package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/release.txt
      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - name: Audit the hash-pinned release toolchain
        run: python -m pip_audit --strict --require-hashes -r requirements/release.txt
      - name: Audit project dependencies and generate CycloneDX SBOM
        run: python -m pip_audit --strict --format cyclonedx-json --output sbom.cdx.json .
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/inspect_dist.py dist --output artifact-inventory.json
      - name: Smoke-test the exact built wheel
        shell: bash
        run: |
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -m venv "$RUNNER_TEMP/systemgmmkit-wheel-smoke"
          smoke_python="$RUNNER_TEMP/systemgmmkit-wheel-smoke/bin/python"
          "$smoke_python" -m pip install --no-cache-dir --only-binary=:all: "${wheels[0]}"
          "$smoke_python" -m pip check
          "$smoke_python" -I scripts/release_smoke.py --expected-version "$package_version"
      - name: Smoke-test the exact built sdist
        shell: bash
        run: |
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#sdists[@]}" -eq 1
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -m venv "$RUNNER_TEMP/systemgmmkit-sdist-smoke"
          smoke_python="$RUNNER_TEMP/systemgmmkit-sdist-smoke/bin/python"
          "$smoke_python" -m pip install --no-cache-dir "${sdists[0]}"
          "$smoke_python" -m pip check
          "$smoke_python" -I scripts/release_smoke.py --expected-version "$package_version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/*
            artifact-inventory.json
            sbom.cdx.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: release
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/dist
